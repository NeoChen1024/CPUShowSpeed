[project]
name = "cpushowspeed"
version = "0.0.0a0"
description = "Research tools for historical CPU performance data"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
cpushowspeed = "cpushowspeed.cli:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["python-src"]

[tool.black]
line-length = 132
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
cpushowspeed = ["web/*.js"]
